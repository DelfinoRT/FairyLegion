name: Actualizar catálogo de colecciones

on:
  push:
    branches: [main]
    paths:
      - 'collection-sprites/**'
      - 'coleccion-silvarion.html'
      - 'coleccion-nemesis.html'
      - 'pokemon-types.json'
      - 'tools/generate-collection-catalog.cjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: collection-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/collection-catalog.test.cjs
      - run: node tools/generate-collection-catalog.cjs
      - name: Guardar y publicar catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar catálogo de colecciones" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
