services:
  collections:
    build: .
    restart: unless-stopped
    environment:
      COLLECTION_DB: /data/collections.sqlite
      COLLECTION_ORIGIN: https://www.fairylegion.com
      NODE_OPTIONS: --max-old-space-size=48
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - collection-data:/data
    init: true
volumes:
  collection-data:
